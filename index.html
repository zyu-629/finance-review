<!doctype html>
<html lang="zh-CN">
<head>

<meta name="robots" content="noindex,nofollow">

<title>财务管理期末复习与刷题</title>
<style>
:root{color-scheme:light;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#172b24;background:#faf9f4}
#landing{width:min(480px,calc(100% - 42px));margin:12vh auto;padding:24px;border:1px solid #dce5dc;background:#fffefa;border-radius:16px;box-sizing:border-box}
#landing h1{margin:0;font-size:25px}
#landing p{line-height:1.6;margin:12px 0}
#landing input,#landing button{font:inherit;border:1px solid #bfcfc3;border-radius:7px;padding:10px;margin-top:8px;box-sizing:border-box}
#landing input{width:100%}
#landing button{background:#174c3e;color:white;cursor:pointer}
</style>
<script src="open.js?v=10" defer></script>
</head>
<body>
<main id="landing"><h1>财务管理期末复习与刷题</h1>
<p id="unlock-state" role="status">正在打开复习资料…</p>
<form id="unlock-form" hidden><label for="unlock-key">专属访问码</label><input id="unlock-key" type="password" autocomplete="off" spellcheck="false" required><button type="submit">打开复习页</button></form>
<noscript>此页面需要启用 JavaScript。</noscript>
</main>
</body>
